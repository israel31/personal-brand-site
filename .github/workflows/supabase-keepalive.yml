
name: Supabase Keep Alive

on:
  schedule:
    # Run every 6 hours, at minute 17 (UTC).
    - cron: "17 */6 * * *"

  # Allow you to run it manually from GitHub.
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check Supabase database activity
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -eu

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "Missing Supabase GitHub repository secrets."
            exit 1
          fi

          STATUS=$(curl --silent --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --max-time 30 \
            --get "${SUPABASE_URL%/}/rest/v1/academy_purchases" \
            --data-urlencode "select=id" \
            --data-urlencode "limit=1" \
            --header "apikey: $SUPABASE_SECRET_KEY" \
            --header "Authorization: Bearer $SUPABASE_SECRET_KEY")

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "Supabase database request succeeded. HTTP $STATUS"
          else
            echo "Supabase database request failed. HTTP $STATUS"
            exit 1
          fi
